
#PostgreSql
spring.application.name=transportfirm
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Transport}
spring.datasource.username=${DB_USERNAME:transportOwner}
spring.datasource.password=${DB_PASSWORD:1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optional but helpful
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.boot.autoconfigure.jdbc=WARN

# HikariCP – tuned for Neon cloud PostgreSQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

jwt.secret.key=${JWT_SECRET:}
server.port=${PORT:8080}
server.servlet.context-path=/api

# Email — sent via Brevo HTTP API (not SMTP).
# Railway blocks all outbound SMTP ports (25, 465, 587, 2525).
# Required env var in Railway: BREVO_API_KEY
# Optional: BREVO_FROM_EMAIL, BREVO_FROM_NAME
#
# Disable Spring Mail auto-configuration (no JavaMailSender needed)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Twilio SMS
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
twilio.enabled=${SMS_ENABLED:false}
