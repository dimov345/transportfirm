# Production overrides — all sensitive values must be provided via environment variables
# IMPORTANT: Use Flyway/Liquibase migrations for schema changes in production.
# 'validate' ensures the schema matches the entities but never auto-modifies it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.boot.autoconfigure.jdbc=WARN
logging.level.root=WARN
logging.level.com.example.transportfirm=INFO
