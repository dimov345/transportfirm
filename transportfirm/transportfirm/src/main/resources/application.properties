# Email — sent via Brevo HTTP API (not SMTP).
# Railway blocks all outbound SMTP ports (25, 465, 587, 2525).
# Required env var in Railway: BREVO_API_KEY
# Optional: BREVO_FROM_EMAIL, BREVO_FROM_NAME
#
# Disable Spring Mail auto-configuration (no JavaMailSender needed)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

