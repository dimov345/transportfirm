<div class="tf-form">
  <!-- Header -->
  <div class="tf-header">
    <div class="tf-header-main">
      <div class="tf-icon">
        <svg class="tf-svg" viewBox="0 0 24 24" fill="none">
          <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"
            fill="currentColor"></path>
        </svg>
      </div>

      <div>
        <h1>{{ isEdit ? 'Редакция на шофьор' : 'Нов шофьор' }}</h1>
        <p class="tf-subtitle">
          {{ isEdit ? 'Променете данните на съществуващ шофьор' : 'Въведете данните на нов шофьор' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="tf-body">
    <form *ngIf="form" [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Шофьорски документи -->
      <div class="tf-section">
        <div class="tf-section-header">
          <div class="tf-section-number">01</div>
          <h2>Шофьорски документи</h2>
        </div>

        <div class="tf-grid">
          <!-- СУМПС -->
          <div class="tf-card">
            <div class="tf-section-header" style="border-bottom: 0; padding-bottom: 0; margin-bottom: 14px;">
              <div class="tf-section-number">
                <svg class="tf-svg" viewBox="0 0 24 24">
                  <path d="M3 13l2-5h14l2 5"/>
                  <circle cx="7.5" cy="17.5" r="2.5"/>
                  <circle cx="16.5" cy="17.5" r="2.5"/>
                  </svg>
                </div>
              <h3>Шофьорска книжка</h3>
            </div>

            <div class="tf-grid">
              <div class="tf-group">
                <label class="tf-label">Издадена на</label>
                <input type="date" formControlName="driverLicenseIssuedOn" class="tf-input">
              </div>

              <div class="tf-group">
                <label class="tf-label">Валидна до</label>
                <input type="date" formControlName="driverLicenseExpiresOn" class="tf-input">
              </div>
            </div>
          </div>

          <!-- Квалификационна карта -->
          <div class="tf-card">
            <div class="tf-section-header" style="border-bottom: 0; padding-bottom: 0; margin-bottom: 14px;">
              <div class="tf-section-number">
                <svg class="tf-svg" viewBox="0 0 24 24">
                  <rect x="3" y="7" width="18" height="13" rx="2"/>
                  <path d="M8 7V5h8v2"/>
                  <path d="M3 13h18"/>
                </svg>
              </div>
              <h3>Квалификационна карта</h3>
            </div>

            <div class="tf-grid">
              <div class="tf-group">
                <label class="tf-label">Издадена на</label>
                <input type="date" formControlName="qualificationCardIssuedOn" class="tf-input">
              </div>

              <div class="tf-group">
                <label class="tf-label">Валидна до</label>
                <input type="date" formControlName="qualificationCardExpiresOn" class="tf-input">
              </div>
            </div>
          </div>

          <!-- Психологическо изследване -->
          <div class="tf-card">
            <div class="tf-section-header" style="border-bottom: 0; padding-bottom: 0; margin-bottom: 14px;">
              <div class="tf-section-number">
                <svg class="tf-svg" viewBox="0 0 24 24">
                  <path d="M12 3a4 4 0 0 1 4 4v1a3 3 0 0 1 3 3v1a3 3 0 0 1-3 3v1a4 4 0 0 1-8 0v-1a3 3 0 0 1-3-3v-1a3 3 0 0 1 3-3V7a4 4 0 0 1 4-4z"/>
                </svg>
              </div>
              <h3>Психологическо изследване</h3>
            </div>

            <div class="tf-grid">
              <div class="tf-group">
                <label class="tf-label">Издадено на</label>
                <input type="date" formControlName="psychologicalExamIssuedOn" class="tf-input">
              </div>

              <div class="tf-group">
                <label class="tf-label">Валидно до</label>
                <input type="date" formControlName="psychologicalExamExpiresOn" class="tf-input">
              </div>
            </div>
          </div>

          <!-- Дигитална карта -->
          <div class="tf-card">
            <div class="tf-section-header" style="border-bottom: 0; padding-bottom: 0; margin-bottom: 14px;">
              <div class="tf-section-number">
                <svg class="tf-svg" viewBox="0 0 24 24">
                  <rect x="2" y="5" width="20" height="14" rx="2"/>
                  <path d="M2 10h20"/>
                  <path d="M6 15h4"/>
                </svg>
              </div>
              <h3>Дигитална карта</h3>
            </div>

            <div class="tf-grid">
              <div class="tf-group">
                <label class="tf-label">Издадена на</label>
                <input type="date" formControlName="digitalCardIssuedOn" class="tf-input">
              </div>

              <div class="tf-group">
                <label class="tf-label">Валидна до</label>
                <input type="date" formControlName="digitalCardExpiresOn" class="tf-input">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="tf-actions">
        <button type="button" class="btn btn-secondary" routerLink="/drivers">
          Отказ
        </button>

        <button type="submit" class="btn btn-primary" [disabled]="loading || saving || form.invalid">
          {{ isEdit ? 'Запази промените' : 'Добави шофьор' }}
        </button>
      </div>

    </form>
  </div>
</div>
