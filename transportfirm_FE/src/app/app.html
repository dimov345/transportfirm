<app-sidebar
  *ngIf="showSidebar"
  (toggleWidth)="onSidebarToggle($event)">
</app-sidebar>

<ng-container *ngIf="!isAuthRoute; else authLayout">
  <main class="app-content"
        [class.collapsed]="isSidebarCollapsed"
        [class.overlay]="!isSidebarCollapsed">
    <router-outlet></router-outlet>
  </main>
</ng-container>

<ng-template #authLayout>
  <!-- ✅ fullscreen auth pages (no padding/margin/white bg) -->
  <router-outlet></router-outlet>
</ng-template>

<!-- Global toast notifications -->
<app-toast></app-toast>
