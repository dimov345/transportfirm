<div class="docs-container">
  <div class="docs-header">
    <div class="header-content">
      <div class="driver-info">
        <h1>Документи на шофьор</h1>
        <div class="egn-badge">{{ egn }}</div>
      </div>
      <p class="subtitle">Управление на прикачени документи и файлове</p>
    </div>
  </div>

  <div class="docs-content">
    <!-- Upload Card -->
    <div class="upload-card">
      <div class="upload-header">
        <div class="upload-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
          </svg>
        </div>
        <h3>Добавяне на документ</h3>
      </div>
      <div class="upload-body">
        <p class="upload-hint">Поддържа се само PDF формат</p>
        <label class="file-input-wrapper">
          <input type="file" (change)="onFileSelected($event)" accept="application/pdf" />
          <span class="file-input-label">Изберете файл</span>
          <span class="file-input-button">Прегледай</span>
        </label>
      </div>
    </div>

    <!-- Documents List -->
    <div class="documents-section">
      <div class="section-header">
        <h2>Прикачени документи</h2>
        <span class="doc-count">{{ documents.length }} файла</span>
      </div>

      <div class="documents-list" *ngIf="documents.length > 0">
        <div class="document-card" *ngFor="let doc of documents">
          <div class="doc-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
          </div>
          <div class="doc-info">
            <div class="doc-name">{{ doc.fileName }}</div>
            <div class="doc-meta">PDF документ</div>
          </div>
          <div class="doc-actions">
            <button class="btn-download" (click)="download(doc.id, doc.fileName)" 
                    title="Изтегли файл">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
              </svg>
            </button>
            <button class="btn-delete" (click)="delete(doc.id)" 
                    title="Изтрий файл">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="documents.length === 0">
        <div class="empty-icon">📁</div>
        <h3>Няма прикачени документи</h3>
        <p>Добавете първия документ като изберете файл отгоре</p>
      </div>
    </div>
  </div>
</div>
