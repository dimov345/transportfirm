<div class="docs-container">
  <div class="docs-header">
    <div class="driver-info">
      <button class="back-btn" routerLink="/drivers">← Назад</button>
      <h1>Документи на шофьор</h1>
      <div class="egn-badge">{{ egn }}</div>
    </div>
    <p class="subtitle">Управление на прикачени документи (PDF)</p>
  </div>

  <div class="docs-content">

    <!-- Upload Card -->
    <div class="upload-card">
      <div class="upload-header">
        <div class="upload-icon">📤</div>
        <h3>Добавяне на документ</h3>
      </div>
      <p class="upload-hint">Поддържа се само PDF формат (макс. 5 MB)</p>

      <label class="file-input-wrapper">
        <input
          type="file"
          #fileInput
          (change)="onFileSelected($event)"
          accept="application/pdf"
          [disabled]="isUploading"
        />
        <span class="file-input-button">
          {{ isUploading ? 'Качване...' : 'Качи документ' }}
        </span>
      </label>
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="isLoading">
      <div class="loading-spinner"></div>
      <p>Зареждане на документи...</p>
    </div>

    <!-- Documents List -->
    <div class="documents-section" *ngIf="!isLoading">

      <div class="section-header">
        <h2>Прикачени документи</h2>
        <span class="doc-count">{{ documents.length }} файла</span>
      </div>

      <div class="documents-list" *ngIf="documents.length > 0">
        <div class="document-card" *ngFor="let doc of documents">
          <div class="doc-icon">📄</div>
          <div class="doc-info">
            <div class="doc-name">{{ doc.fileName }}</div>
          </div>
          <div class="doc-actions">
            <button class="btn-download" (click)="download(doc.id, doc.fileName)" [disabled]="isUploading">⬇️</button>
            <button class="btn-delete" (click)="delete(doc.id)" [disabled]="isUploading">🗑️</button>
          </div>
        </div>
      </div>

      <div class="empty-state" *ngIf="documents.length === 0">
        <div class="empty-icon">📂</div>
        <h3>Няма прикачени документи</h3>
        <p>Качете първия PDF документ</p>
      </div>
    </div>
  </div>
</div>
