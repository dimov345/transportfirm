<div class="drivers-form">
  <div class="form-header">
    <div class="header-main">
      <div class="driver-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
        </svg>
      </div>
      <div>
        <h1>{{ isEdit ? 'Редакция на шофьор' : 'Нов шофьор' }}</h1>
        <p class="subtitle">
          {{ isEdit ? 'Променете данните на съществуващ шофьор' : 'Въведете данните на нов шофьор' }}
        </p>
      </div>
    </div>
  </div>

  <div class="form-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Лични данни -->
      <div class="form-section">
        <div class="section-header">
          <span class="section-number">01</span>
          <h2>Лични данни</h2>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">ЕГН</label>
            <input type="text" formControlName="egn" [readonly]="isEdit" 
                   class="form-input" placeholder="Въведете ЕГН">
            <div class="input-hint">10 цифри</div>
          </div>

          <div class="form-group">
            <label class="form-label">Име</label>
            <input type="text" formControlName="name" 
                   class="form-input" placeholder="Пълно име">
          </div>

          <div class="form-group">
            <label class="form-label">Телефон</label>
            <input type="text" formControlName="phone" 
                   class="form-input" placeholder="+359 888 123 456">
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" formControlName="email" 
                   class="form-input" placeholder="example@company.com">
          </div>
        </div>
      </div>

      <!-- Шофьорски документи -->
      <div class="form-section">
        <div class="section-header">
          <span class="section-number">02</span>
          <h2>Шофьорски документи</h2>
        </div>
        
        <div class="documents-grid">
          <!-- СУМПС -->
          <div class="document-group">
            <div class="document-header">
              <div class="document-icon">🚗</div>
              <h3>Шофьорска книжка</h3>
            </div>
            <div class="date-fields">
              <div class="form-group">
                <label class="form-label">Издадена на</label>
                <input type="date" formControlName="driverLicenseIssuedOn" class="form-input">
              </div>
              <br>
              <div class="form-group">
                <label class="form-label">Валидна до</label>
                <input type="date" formControlName="driverLicenseExpiresOn" class="form-input">
              </div>
            </div>
          </div>

          <!-- Квалификационна карта -->
          <div class="document-group">
            <div class="document-header">
              <div class="document-icon">💼</div>
              <h3>Квалификационна карта</h3>
            </div>
            <div class="date-fields">
              <div class="form-group">
                <label class="form-label">Издадена на</label>
                <input type="date" formControlName="qualificationCardIssuedOn" class="form-input">
              </div>
              <br>
              <div class="form-group">
                <label class="form-label">Валидна до</label>
                <input type="date" formControlName="qualificationCardExpiresOn" class="form-input">
              </div>
            </div>
          </div>

          <!-- Психологическо изследване -->
          <div class="document-group">
            <div class="document-header">
              <div class="document-icon">🧠</div>
              <h3>Психологическо изследване</h3>
            </div>
            <div class="date-fields">
              <div class="form-group">
                <label class="form-label">Издадено на</label>
                <input type="date" formControlName="psychologicalExamIssuedOn" class="form-input">
              </div>
              <br>
              <div class="form-group">
                <label class="form-label">Валидно до</label>
                <input type="date" formControlName="psychologicalExamExpiresOn" class="form-input">
              </div>
            </div>
          </div>

          <!-- Дигитална карта -->
          <div class="document-group">
            <div class="document-header">
              <div class="document-icon">💳</div>
              <h3>Дигитална карта</h3>
            </div>
            <div class="date-fields">
              <div class="form-group">
                <label class="form-label">Издадена на</label>
                <input type="date" formControlName="digitalCardIssuedOn" class="form-input">
              </div>
              <br>
              <div class="form-group">
                <label class="form-label">Валидна до</label>
                <input type="date" formControlName="digitalCardExpiresOn" class="form-input">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" routerLink="/">
          Отказ
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
          {{ isEdit ? 'Запази промените' : 'Добави шофьор' }}
        </button>
      </div>
    </form>
  </div>
</div>
