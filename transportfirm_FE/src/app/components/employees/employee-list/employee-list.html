<div class="list-container">
  <div class="list-header">
    <div class="header-content">
      <div class="title-section">
        <h1>Служители</h1>
        <p class="subtitle">Общо {{ filtered.length }} служители</p>
      </div>

      <div class="header-actions">
        <button type="button" class="btn-add" (click)="createEmployee()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
          </svg>
          Нов служител
        </button>
      </div>
    </div>
  </div>

  <!-- Filters / Search -->
  <div class="search-bar-container filters-bar">
    <input
      type="text"
      placeholder="Търси по име или ЕГН..."
      class="search-input"
      [(ngModel)]="searchText"
      (input)="search()"
    />
  </div>

  <div class="table-container">
    <table *ngIf="filtered.length > 0">
      <thead>
        <tr>
          <th class="col-egn">ЕГН</th>
          <th class="col-name">Име</th>
          <th class="col-phone">Телефон</th>
          <th class="col-email">Имейл</th>
          <th class="col-job">Длъжност</th>
          <th class="col-actions">Действия</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let emp of filtered; trackBy: trackByEmployeeId" class="driver-row">
          <td class="egn-cell">
            <div class="egn-value">{{ emp.egn }}</div>
          </td>

          <td class="name-cell">
            <div class="driver-name">{{ emp.name }}</div>
          </td>

          <td class="phone-cell">
            <div class="phone-value">{{ emp.phone }}</div>
          </td>

          <td class="email-cell">
            <div class="email-value" [class.no-email]="!emp.email">
              {{ emp.email || 'Няма имейл' }}
            </div>
          </td>

          <td class="job-cell">
            <div class="job-value" [class.no-job]="!emp.jobTitle">
              {{ emp.jobTitle || '—' }}
            </div>
          </td>

          <td class="actions-cell">
            <div class="actions-group">
              <button type="button" class="btn-action btn-edit" (click)="viewDetails(emp.id!)" title="Детайли">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 10c-1.93 0-3.5-1.57-3.5-3.5S10.07 8 12 8s3.5 1.57 3.5 3.5S13.93 15 12 15z"/>
                </svg>
              </button>

              <button type="button" class="btn-action btn-edit" (click)="editEmployee(emp.id!)" title="Редакция">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/>
                </svg>
              </button>

              <button type="button" class="btn-action btn-docs" (click)="viewDocuments(emp.id!)" title="Документи">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                </svg>
              </button>

              <button type="button" class="btn-action btn-delete" (click)="deleteEmployee(emp.id!)" title="Изтрий">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="empty-state" *ngIf="filtered.length === 0">
      <div class="empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <h3>Няма намерени служители</h3>
    </div>
  </div>
</div>
