<div class="employee-list">

  <div class="top-bar">
    <input 
      type="text" 
      placeholder="Търси по име, ЕГН или длъжност..."
      [(ngModel)]="searchText"
      (input)="search()"
    />

    <button class="create-btn" (click)="createEmployee()">+ Нов служител</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ЕГН</th>
        <th>Име</th>
        <th>Телефон</th>
        <th>Имейл</th>
        <th>Длъжност</th>
        <th>Действия</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let emp of filtered">
        <td>{{ emp.egn }}</td>
        <td>{{ emp.name }}</td>
        <td>{{ emp.phone }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.jobTitle }}</td>

        <td class="actions">
          <button class="details" (click)="viewDetails(emp.id!)">Детайли</button>
          <button class="edit" (click)="editEmployee(emp.id!)">Редакция</button>
          <button class="docs" (click)="viewDocuments(emp.id!)">Документи</button>
          <button class="delete" (click)="deleteEmployee(emp.id!)">Изтрий</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
