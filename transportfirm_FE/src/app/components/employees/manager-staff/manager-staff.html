<div class="list-container">

  <!-- ── Header ─────────────────────────────────────────── -->
  <div class="list-header">
    <div class="header-content">
      <div class="title-section">
        <h1>Служители</h1>
        <p class="subtitle">Общо {{ filtered.length }} служители</p>
      </div>
    </div>
  </div>

  <!-- ── Search ─────────────────────────────────────────── -->
  <div class="search-bar-container filters-bar">
    <input
      type="text"
      class="search-input"
      placeholder="Търси по име, длъжност, имейл..."
      [(ngModel)]="searchText"
      (input)="search()"
    />
  </div>

  <!-- ── Loading ────────────────────────────────────────── -->
  <div class="ms-grid" *ngIf="loading">
    <div class="ms-skeleton" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>

  <!-- ── Empty ──────────────────────────────────────────── -->
  <div class="empty-state" *ngIf="!loading && filtered.length === 0">
    <div class="empty-icon">
      <i class="material-icons" style="font-size:48px;color:#9ca3af">person_search</i>
    </div>
    <h3>Няма намерени служители</h3>
  </div>

  <!-- ── Card grid ──────────────────────────────────────── -->
  <div class="ms-grid" *ngIf="!loading && filtered.length > 0">
    <div class="ms-card" *ngFor="let emp of filtered; trackBy: trackById">

      <!-- Avatar + name -->
      <div class="ms-card__top">
        <div class="ms-card__avatar" [style.background]="colorFor(emp.jobTitle)">
          {{ initials(emp.name) }}
        </div>
        <div class="ms-card__identity">
          <div class="ms-card__name">{{ emp.name }}</div>
          <span class="ms-card__role-chip"
                [style.color]="colorFor(emp.jobTitle)"
                [style.border-color]="colorFor(emp.jobTitle) + '55'">
            {{ labelFor(emp.jobTitle) }}
          </span>
        </div>
      </div>

      <!-- Contact -->
      <div class="ms-card__contacts">
        <div class="ms-card__contact-row" *ngIf="emp.phone">
          <i class="material-icons">phone</i>
          <span>{{ emp.phone }}</span>
        </div>
        <div class="ms-card__contact-row" *ngIf="emp.email">
          <i class="material-icons">email</i>
          <span class="ms-card__email">{{ emp.email }}</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="ms-card__actions">
        <button class="btn-action btn-edit" type="button"
                (click)="viewDetails(emp.id)" title="Детайли">
          <i class="material-icons">visibility</i>
          Детайли
        </button>
        <button class="btn-action btn-edit" type="button"
                (click)="editEmployee(emp.id)" title="Редакция">
          <i class="material-icons">edit</i>
          Редакция
        </button>
      </div>
    </div>
  </div>

</div>
