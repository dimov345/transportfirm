<div class="ms-page">

  <!-- ── Header ─────────────────────────────────────────── -->
  <div class="ms-header">
    <div class="ms-header__left">
      <h1 class="ms-header__title">
        <i class="material-icons">groups</i>
        Служители
      </h1>
      <span class="ms-header__count">{{ filtered.length }} служители</span>
    </div>

    <div class="ms-header__search">
      <i class="material-icons ms-header__search-icon">search</i>
      <input
        type="text"
        class="ms-header__search-input"
        placeholder="Търси по име, длъжност, имейл..."
        [(ngModel)]="searchText"
        (input)="search()"
      />
    </div>
  </div>

  <!-- ── Loading ────────────────────────────────────────── -->
  <div class="ms-loading" *ngIf="loading">
    <div class="ms-skeleton" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>

  <!-- ── Empty ──────────────────────────────────────────── -->
  <div class="ms-empty" *ngIf="!loading && filtered.length === 0">
    <i class="material-icons">person_search</i>
    <p>Няма намерени служители</p>
  </div>

  <!-- ── Card grid ──────────────────────────────────────── -->
  <div class="ms-grid" *ngIf="!loading && filtered.length > 0">
    <div class="ms-card" *ngFor="let emp of filtered; trackBy: trackById">

      <!-- Avatar + name -->
      <div class="ms-card__top">
        <div class="ms-card__avatar" [style.background]="colorFor(emp.jobTitle)">
          {{ initials(emp.name) }}
        </div>
        <div class="ms-card__identity">
          <div class="ms-card__name">{{ emp.name }}</div>
          <span class="ms-card__role-chip"
                [style.background]="colorFor(emp.jobTitle) + '1a'"
                [style.color]="colorFor(emp.jobTitle)"
                [style.border-color]="colorFor(emp.jobTitle) + '40'">
            {{ labelFor(emp.jobTitle) }}
          </span>
        </div>
      </div>

      <!-- Contact info -->
      <div class="ms-card__contacts">
        <div class="ms-card__contact-row" *ngIf="emp.phone">
          <i class="material-icons">phone</i>
          <a [href]="'tel:' + emp.phone">{{ emp.phone }}</a>
        </div>
        <div class="ms-card__contact-row" *ngIf="emp.email">
          <i class="material-icons">email</i>
          <a [href]="'mailto:' + emp.email" class="ms-card__email">{{ emp.email }}</a>
        </div>
      </div>

      <!-- Actions -->
      <div class="ms-card__actions">
        <button class="ms-btn ms-btn--primary" (click)="viewDetails(emp.id)">
          <i class="material-icons">visibility</i>
          Детайли
        </button>
        <button class="ms-btn ms-btn--secondary" (click)="editEmployee(emp.id)">
          <i class="material-icons">edit</i>
          Редакция
        </button>
      </div>
    </div>
  </div>

</div>
