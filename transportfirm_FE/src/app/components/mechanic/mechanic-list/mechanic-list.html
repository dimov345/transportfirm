<div class="list-container">
  <!-- HEADER -->
  <div class="list-header">
    <div class="header-content">
      <div class="title-section">
        <h1>Механици</h1>
        <p class="subtitle">Общо {{ mechanics.length }} механика</p>
      </div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters-bar">
    <input
      type="text"
      placeholder="Търси по име или ЕГН..."
      class="search-input"
      [(ngModel)]="filters.search"
      (input)="applyFilters()"
    />
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div *ngIf="loading" class="loading-state">
      Зареждане...
    </div>

    <table *ngIf="!loading && mechanics.length > 0">
      <thead>
        <tr>
          <th class="col-egn">ЕГН</th>
          <th class="col-name">Име</th>
          <th class="col-phone">Телефон</th>
          <th class="col-email">Имейл</th>
          <th class="col-status">Статус</th>
          <th class="col-actions">Действия</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let m of mechanics; trackBy: trackByEmployeeId"
          class="table-row"
        >
          <td>
            <div class="cell-value">{{ m.employee.egn }}</div>
          </td>

          <td>
            <div class="cell-name">{{ m.employee.name }}</div>
          </td>

          <td>
            <div class="cell-value">{{ m.employee.phone || '—' }}</div>
          </td>

          <td>
            <div class="cell-value" [class.no-email]="!m.employee.email">
              {{ m.employee.email || 'Няма имейл' }}
            </div>
          </td>

          <td>
            <span class="status-badge" [ngClass]="getStatusClass(m.employee.employmentStatus)">
              {{ getStatusLabel(m.employee.employmentStatus) }}
            </span>
          </td>

          <td class="actions-cell">
            <div class="actions-group">
              <button
                type="button"
                class="btn-action btn-view"
                (click)="viewDetails(m.employeeId)"
                title="Детайли"
              >
                <i class="material-icons">visibility</i>
                Детайли
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- EMPTY -->
    <div class="empty-state" *ngIf="!loading && mechanics.length === 0">
      <i class="material-icons">build</i>
      <h3>Няма намерени механици</h3>
    </div>
  </div>
</div>
